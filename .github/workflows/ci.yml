name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Layout convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-structure.sh

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint .

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      # Bump this when you want the examples checked against a newer Kubernetes.
      # It is what catches APIs that got removed.
      KUBERNETES_VERSION: "1.31.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate against Kubernetes ${{ env.KUBERNETES_VERSION }}
        run: |
          .github/scripts/k8s-manifests.sh | xargs kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files '*.sh' | xargs shellcheck --severity=warning

  links:
    name: README links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only resolve links to files in the repo. External URLs are not
          # checked on purpose, they rate-limit and would make the build flaky.
          args: --offline --no-progress --verbose './**/*.md'
          fail: true
